apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-dep
  namespace: flask
  labels:
    app: flask
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask
        image: suyashdahitule/quotes-app:latest
        ports:
        - containerPort: 8000

